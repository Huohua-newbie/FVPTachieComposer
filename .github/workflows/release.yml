# 门禁式发布流水线：构建 → Draft 暂存 → 人工冒烟测试 → 手动放行
#
# 规则（防污染公开 Release 页）：
# 1. 本 workflow 只创建/更新 Draft release，绝不公开发布；
# 2. 已公开发布的 Release 永不 --clobber，修复走新 tag；
# 3. 放行 = 人工按 TESTING.md 验证通过后，在仓库页点 Publish
#   （beta 设为 Pre-release，stable 设为 Latest）；或用命令：
#    gh release edit <tag> --draft=false [--prerelease|--latest]
#
name: Build & Stage Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要（重新）构建并暂存到 Draft 的 tag，例如 v2.2.0-beta'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Self check
        run: python .github/selfcheck.py

      - name: Build exe
        run: |
          pyinstaller --onefile --noconfirm --noconsole `
            --name FVPTachieComposer `
            --icon Shinku.ico `
            --add-data "Shinku.ico;." `
            --distpath dist --workpath build --specpath build `
            FVPTachieComposerFlet.py

      - name: Verify icon embedded
        shell: pwsh
        run: |
          Select-String -Path build/FVPTachieComposer/PKG-00.toc -Pattern 'Shinku.ico' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Shinku.ico missing from PKG datas' }
          Add-Type -AssemblyName System.Drawing
          $a = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD/dist/FVPTachieComposer.exe")
          $b = [System.Drawing.Icon]::ExtractAssociatedIcon("$env:SystemRoot/System32/notepad.exe")
          $ms1 = New-Object IO.MemoryStream; $a.ToBitmap().Save($ms1, [System.Drawing.Imaging.ImageFormat]::Png)
          $ms2 = New-Object IO.MemoryStream; $b.ToBitmap().Save($ms2, [System.Drawing.Imaging.ImageFormat]::Png)
          if ([BitConverter]::ToString($ms1.ToArray()) -eq [BitConverter]::ToString($ms2.ToArray())) { throw 'exe icon check inconclusive' }
          Write-Host 'icon check passed'

      - name: Package and checksum
        shell: pwsh
        run: |
          $ver = $env:TAG -replace '^v',''
          $zip = "FVPTachieComposer-$ver-win64.zip"
          Compress-Archive -Path dist/FVPTachieComposer.exe -DestinationPath "dist/$zip" -Force
          $h = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Stage to Draft release
        shell: pwsh
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG "dist/$env:ZIP" dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:TAG "dist/$env:ZIP" dist/SHA256SUMS.txt `
              --draft --prerelease `
              --title "FVP Tachie Composer $env:TAG" `
              --notes-file .github/RELEASE_NOTES_TEMPLATE.md
          }
